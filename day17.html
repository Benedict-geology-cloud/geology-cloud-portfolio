<!DOCTYPE html>
<html>
<head>
<title>Day 17 - Interactive Geology</title>
<style>
  body { background: #f4f6f7; font-family: Arial; margin: 0; padding: 20px; }
  h1 { background: #0a3d62; color: white; padding: 15px; border-radius: 8px; text-align: center; }
  .card { background: white; padding: 20px; border-radius: 8px; margin: 15px 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  button { background: #0a3d62; color: white; padding: 10px 15px; border: none; border-radius: 5px; margin: 5px; cursor: pointer; }
  button:hover { background: #f39c12; }
  #result { background: #eaf6ec; border-left: 5px solid #27ae60; padding: 15px; margin-top: 15px; font-weight: bold; }
</style>
</head>
<body>

<h1>Day 17: Interactive Niger Delta</h1>

<div class="card">
<h2>Click to Explore Formations!</h2>
<button onclick="showBenin()">Benin Formation</button>
<button onclick="showAgbada()">Agbada Formation</button>
<button onclick="showAkata()">Akata Formation</button>
<button onclick="calcDepth()">Calculate Akata Depth!</button>

<div id="result">Click any button above... result go show here!</div>
</div>

<script>
// This is JavaScript - The Brain!
function showBenin() {
  document.getElementById("result").innerHTML = "🏜️ <b>Benin Formation:</b> 0-2000m depth. Sand & Gravel, Freshwater aquifer for Warri/Asaba! Continental environment.";
}

function showAgbada() {
  document.getElementById("result").innerHTML = "🛢️ <b>Agbada Formation:</b> 2000-3500m. Where OIL & GAS dey! Alternating sand/shale - Paralic. Main reservoir!";
}

function showAkata() {
  document.getElementById("result").innerHTML = "🌊 <b>Akata Formation:</b> 3500m+ to bottom. Marine shale, source rock, overpressured! Where oil born.";
}

function calcDepth() {
  let benin = 2000;
  let agbada = 1500;
  let total = benin + agbada;
  alert("Calculation:\nBenin (2000m) + Agbada (1500m) = " + total + "m\nSo Akata starts at ~" + total + "m depth!");
  document.getElementById("result").innerHTML = "📏 <b>Akata Depth = " + total + "m</b> (Benin + Agbada). Drilling cost go high from here!";
}
</script>

<p><a href="day15.html">Back to Day 15</a> | <a href="index.html">Home</a></p>

</body>
</html>
