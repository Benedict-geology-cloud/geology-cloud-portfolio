<!DOCTYPE html>
<html>
<head>
<title>Day 18 - Niger Delta Field Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  body { margin:0; font-family: Arial; background: #f4f6f7; }
  h1 { background: #0a3d62; color: white; padding: 15px; text-align: center; margin:0; }
  #map { height: 500px; width: 100%; }
  .info { background: white; padding: 15px; margin: 10px; border-radius: 8px; }
</style>
</head>
<body>

<h1>Day 18: My Niger Delta Field Map</h1>

<div class="info">
<b>Benedict Field Area:</b> 6 key towns for Benin-Agbada-Akata study. Click markers!
<br><a href="day17.html">Day 17</a> | <a href="day15.html">Day 15</a> | <a href="index.html">Home</a>
</div>

<div id="map"></div>

<script>
// 1. Create map centered on Warri
var map = L.map('map').setView([5.5, 5.8], 8);

// 2. Add free tiles (the actual map image)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

// 3. Add 6 markers - Our field towns!
var towns = [
  {name: "Warri - Base Camp", coords: [5.5167, 5.75], desc: "My base! Benin Formation sand quarry. Logistics hub."},
  {name: "Sapele", coords: [5.8941, 5.6765], desc: "Benin Formation outcrop - timber & sand"},
  {name: "Ughelli", coords: [5.4896, 6.0076], desc: "Agbada Formation - Near oil wells!"},
  {name: "Asaba", coords: [6.1988, 6.7319], desc: "Benin Formation - Niger River bank exposure"},
  {name: "Port Harcourt", coords: [4.8156, 7.0498], desc: "Agbada/Akata boundary - SPDC, Total HQ"},
  {name: "Bayelsa (Yenagoa)", coords: [4.9218, 6.2644], desc: "Akata shale - Deep marine, source rock!"}
];

// Loop through towns and add marker
towns.forEach(function(town) {
  L.marker(town.coords).addTo(map)
    .bindPopup("<b>" + town.name + "</b><br>" + town.desc);
});

</script>

<div class="info" id="result">
<b>How it works:</b> This map uses Leaflet.js - <code>L.map()</code> creates map, <code>L.marker()</code> adds pin!
</div>

</body>
</html>
